<!DOCTYPE html>
<html lang="fr">
  <head>    
    <meta  charset="utf-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link href="css/photographer.css" rel="stylesheet" type="text/css" />
    <link href="css/modal.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Fisheye - photographe </title>
  </head> 
  <body>
    <header class="Fisheye__header">
      <a class="Fisheye__header--link" href="./index.html">
        <img  src="assets/images/logo.png" class="logo" alt="Fisheye To Home page" aria-label="Retour sur la page d'accueil" />
      </a> 
    </header>
    <main id="main">
      <header class="photograph__header"></header>
      <article class="media__container">
        <section id="filter__section">
          <h2>Trier par</h2>
          <div class="filter" >
            <div class="filter__Dropdown">
                <button id="filter__Dropdown--BtnJS" class="filter__Dropdown--Btn" type="button" role="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="filter options" aria-label="Sort by">
                    <span id="Selected__FilterJS" class="filter__Dropdown--BtnTitle">Titre</span>
                    <span class="fa-solid fa-chevron-up" aria-hidden="true"></span>
                </button>
                <ul class="filter__Dropdown--Ul" aria-hidden="true">
                    <li class="dropdown__option" role="option">
                        <button class="dropdown__option--btn" type="button" tabindex="-1" aria-label="Sort by title">Titre</button>
                    </li>
                    <li class="dropdown__option" role="option">
                        <button class="dropdown__option--btn" type="button" tabindex="-1" aria-label="Sort by popularity">Popularité</button>
                    </li>
                    <li class="dropdown__option" role="option">
                        <button class="dropdown__option--btn" type="button" tabindex="-1" aria-label="Sort by date">Date</button>
                    </li>
                </ul>
            </div>
          </div>
        </section>
        <section class="picture__container" aria-label="Exposition de plusieurs clichés pris par le photographe">
        </section>
      </article>
    </main>
    <!--Pop-up Windows section-->
      <!--Contact--Modal-->
        <div id="contact__modal">
          <div class="modal__form">
            <header>          
                <h2 class="modal__form--title" aria-labelledby="photographerName" tabindex="1">Contactez-moi</h2>                        
                <span id="closeModalJS" class="modal__form--BtnClose" role="button" aria-label="clicker pour fermer le formulaire de contact"></span>                 
            </header>
            <p id="photographerName" class="modal__form--photographerName"></p>
            <form id="contact__form">
              <div class="contact__form--data">
                <label id="FirstName" name="firstNameJS">Prénom</label>
                <input id="firstNameJS" class="text-control" type="text" placeholder="Veuillez saisir votre prénom" aria-placeholder="Veuillez saisir votre prénom"  aria-labelledby="FirstName"/>
              </div>
              <div class="contact__form--data">
                <label id="LastName" name="lastNameJS">Nom</label>
                <input id="lastNameJS" class="text-control" type="text" placeholder="Veuillez saisir votre nom" aria-placeholder="Veuillez saisir votre nom" aria-labelledby="LastName"/>
              </div>
              <div class="contact__form--data">
                <label id="Email" name="emailJS">Email</label>
                <input id="emailJS" class="text-control" type="email" placeholder="Veuillez saisir votre adresse mail" aria-placeholder="Veuillez saisir votre adresse mail" aria-labelledby="Email"/>
              </div>
              <div class="contact__form--data">                
                <label id="Message" name="userMessageJS">Votre message</label>
                <textarea id="userMessageJS" class="text-control" type="textarea" rows="10" placeholder="Veuillez saisir votre message" maxlength="300" wrap="hard" aria-placeholder="Veuillez saisir votre message 300 caractères maximum" aria-labelledby="Message"></textarea>
              </div>
              <button id="sendFormContactBtn" class="contact_button" type="submit" form="contact__form" aria-label="Bouton envoyer" name="envoyer">Envoyer</button>
            </form>
          </div>
        </div>

      <!--LightBox-->
        <div id="lightboxWrapperJs" class="lightbox" aria-modal="true" role="dialog">
          <div class="lightbox__container" aria-label="Vue grand format sur le media choisi">
            <button id="closelightBoxJS" class="lightbox__container--closeBtn" aria-label="close lightbox"></button>
            <button id="nextMediaJS" class="lightbox__container--arrowNext" aria-label="next media"></button>
            <button id="previousMediaJS" class="lightbox__container--arrowPrevious" aria-label="previous media"></button>
            <figure class="lightbox__container--media" role="media" aria-label="current media">
            </figure>            
          </div>
        </div>
    
  </body>
  <script src="/scripts/pages/photographer.js" type="module" ></script>
  <script src="/scripts/utils/contactForm.js" type="module" ></script>
</html>
